name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  platform-matrix:
    name: Define platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platform-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load platform matrix
        id: platform-matrix
        run: |
          echo "matrix=$(jq -c . .github/platform-matrix.json)" >> "$GITHUB_OUTPUT"

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "stable"

  clippy:
    name: Clippy (${{ matrix.platform.target }}, ${{ matrix.profile }})
    needs: [format, deps, platform-matrix]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
        profile: ${{ fromJSON(github.base_ref == 'main' && '["debug","release"]' || '["debug"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Run clippy (debug)
        if: matrix.profile == 'debug'
        run: cargo clippy --target ${{ matrix.platform.target }} --locked --workspace --all-targets -- -D warnings

      - name: Run clippy (release)
        if: matrix.profile == 'release'
        run: cargo clippy --target ${{ matrix.platform.target }} --release --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.platform.target }}, ${{ matrix.profile }})
    needs: [format, deps, platform-matrix]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
        profile: ${{ fromJSON(github.base_ref == 'main' && '["debug","release"]' || '["debug"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build (debug)
        if: matrix.profile == 'debug'
        run: cargo build --target ${{ matrix.platform.target }} --locked --workspace

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --target ${{ matrix.platform.target }} --locked --workspace

      - name: Build (release)
        if: matrix.profile == 'release'
        run: cargo build --target ${{ matrix.platform.target }} --release --locked --workspace

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --target ${{ matrix.platform.target }} --release --locked --workspace

  rust:
    name: Rust
    if: always()
    needs: [format, deps, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
