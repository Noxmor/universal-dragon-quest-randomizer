name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "stable"

  clippy:
    name: Clippy (${{ matrix.target }}, ${{ matrix.profile }})
    needs: [format, deps]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
        profile: ${{ fromJSON(github.base_ref == 'main' && '["debug","release"]' || '["debug"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run clippy (debug)
        if: matrix.profile == 'debug'
        run: cargo clippy --target ${{ matrix.target }} --locked --workspace --all-targets -- -D warnings

      - name: Run clippy (release)
        if: matrix.profile == 'release'
        run: cargo clippy --target ${{ matrix.target }} --release --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.target }}, ${{ matrix.profile }})
    needs: [format, deps]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
        profile: ${{ fromJSON(github.base_ref == 'main' && '["debug","release"]' || '["debug"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (debug)
        if: matrix.profile == 'debug'
        run: cargo build --target ${{ matrix.target }} --locked --workspace

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --target ${{ matrix.target }} --locked --workspace

      - name: Build (release)
        if: matrix.profile == 'release'
        run: cargo build --target ${{ matrix.target }} --release --locked --workspace

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --target ${{ matrix.target }} --release --locked --workspace

  rust:
    name: Rust
    if: always()
    needs: [format, deps, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
