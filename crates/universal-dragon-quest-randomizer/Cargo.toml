[package]
name = "universal-dragon-quest-randomizer"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Noxmor/universal-dragon-quest-randomizer"

[dependencies]
eframe = "0.36.2"
egui-async = "0.6.0"
rfd = "0.17.2"
sha2 = "0.10"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
syn = "2"
proc-macro2 = "1"
quote = "1"
