[licenses]
confidence-threshold = 0.8

allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = [
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[advisories]
unmaintained = "workspace"
